<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画风图鉴 · 照片双区风格海报</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f4f6f9;
  --sheet: #fdfdff;
  --ink: #17243a;
  --muted: #4d5e75;
  --rule: #74849c;
  --line: #d5deeb;
  --mat: #e5ebf4;
  --accent: #1644bd;
  --tint: #e6edfe;
  --on-accent: #fdfdff;
  --cover: #182b4a;
  --cover-ink: #f2f5ff;
  --cover-muted: #bdcdee;
  --space: clamp(1rem, 3.5vw, 3.25rem);
  --gutter: clamp(.75rem, 1.45vw, 1.5rem);
  --dock-clearance: calc(6.5rem + env(safe-area-inset-bottom));
  --sans: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "SFMono-Regular", ui-monospace, monospace;
  --ease: cubic-bezier(.2,.72,.25,1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151d2b;
    --sheet: #202b3d;
    --ink: #eef3fc;
    --muted: #bdcbe1;
    --rule: #7e92b0;
    --line: #41516a;
    --mat: #2b3a51;
    --accent: #98b5ff;
    --tint: #233660;
    --on-accent: #15274c;
    --cover: #1b2d4e;
    --cover-ink: #f2f5ff;
    --cover-muted: #bdcdee;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-gutter: stable; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.55 var(--sans); }
body:has(dialog[open]) { overflow: hidden; }
main { width: min(100%, 92rem); margin-inline: auto; padding: 0 var(--space) var(--space); }
main:has(#comparison-bar:not([hidden])) { padding-bottom: calc(var(--space) + var(--dock-clearance)); }
html:has(#comparison-bar:not([hidden])) { scroll-padding-bottom: var(--dock-clearance); }
h1,h2,h3,p,figure { margin: 0; }
button,input { min-width: 0; min-height: 2.75rem; color: inherit; font: inherit; border-radius: 0; }
button { padding: .4rem .7rem; border: 1px solid var(--rule); background: transparent; cursor: pointer; }
button:hover:not(:disabled):not([aria-disabled="true"]) { border-color: var(--accent); color: var(--accent); }
button:disabled, button[aria-disabled="true"] { color: var(--muted); cursor: default; }
a { color: var(--accent); text-underline-offset: .26em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.primary { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.primary:hover:not(:disabled):not([aria-disabled="true"]) { color: var(--on-accent); background: var(--accent); }
.primary:disabled { color: var(--muted); background: var(--mat); border-color: var(--line); }
button[aria-pressed="true"]:not(.image-button) { color: var(--accent); background: var(--tint); border-color: var(--accent); }

.issue-line, footer { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.issue-line { min-height: 4rem; border-bottom: 1px solid var(--rule); font-size: .86rem; }
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; }
.brand-mark {
  display: inline-block; width: .8rem; height: 1.02rem; border: 1px solid currentColor;
  background: linear-gradient(to bottom, transparent 48%, currentColor 48% 55%, var(--accent) 55%);
}
.issue-line a, footer a { display: inline-flex; min-height: 2.75rem; align-items: center; }
footer { margin-top: clamp(1.5rem, 4vw, 3rem); border-top: 1px solid var(--line); font-size: .85rem; }

.hero {
  display: grid; grid-template-columns: minmax(16rem, 1fr) minmax(0, 2fr);
  column-gap: var(--gutter); align-items: stretch;
  margin-block: clamp(1rem, 2.4vw, 1.8rem) clamp(1.15rem, 1.9vw, 1.75rem);
}
.cover-story {
  min-width: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  gap: .85rem; padding: clamp(1.25rem, 3.25vw, 3rem);
  background: var(--cover); color: var(--cover-ink);
}
.cover-story h1 { font-size: clamp(3.1rem, 5.3vw, 5.85rem); line-height: 1; letter-spacing: -.046em; }
.cover-story h1 span { display: block; }
.cover-story h1 span + span { color: var(--cover-muted); }
.cover-story p { color: var(--cover-muted); font-size: .87rem; }
#cover-count { display: block; margin-bottom: .32rem; font: .9rem/1.45 var(--mono); color: var(--cover-ink); }
.cover-link {
  display: inline-flex; min-height: 2.75rem; align-items: center; padding: .35rem .75rem;
  border: 1px solid var(--cover-muted); color: var(--cover-ink); text-decoration: none; font-size: .85rem;
}
.cover-link:hover { background: var(--cover-ink); color: var(--cover); }
.cover-story :focus-visible { outline-color: var(--cover-ink); }

.showcase { min-width: 0; display: flex; flex-direction: column; }
.showcase h2 { color: var(--muted); font-size: .8rem; font-weight: 600; margin-bottom: .48rem; }
.feature-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: var(--gutter); }
.feature { min-width: 0; }
.image-button {
  display: block; width: 100%; padding: 0; border: 0; overflow: hidden;
  aspect-ratio: 3/4; background: var(--mat);
}
.image-button img, .pending-preview, .detail-art img, .compare img {
  display: block; width: 100%; height: 100%; object-fit: contain;
}
.feature h3 {
  display: flex; align-items: baseline; gap: .46rem; margin-top: .38rem;
  font-size: clamp(.76rem, 1.1vw, .95rem); overflow-wrap: anywhere;
}
.feature-action {
  margin-top: .12rem; padding: .2rem 0; border: 0; min-height: 2.75rem;
  color: var(--accent); font-size: .79rem; text-decoration: underline; text-underline-offset: .24em;
}
.number { color: var(--accent); font: .86rem/1.4 var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }

.catalog { scroll-margin-top: .7rem; }
.catalog-tools {
  position: sticky; top: 0; z-index: 1; background: var(--paper);
  display: grid; grid-template-columns: minmax(0,1fr) minmax(12rem,24rem) auto;
  align-items: end; gap: .5rem var(--gutter); border-block: 1px solid var(--line);
  padding-block: .7rem .55rem;
}
.catalog-tools h2 { font-size: clamp(1.25rem, 2.1vw, 1.8rem); line-height: 1.2; letter-spacing: -.035em; padding-bottom: .34rem; }
.search-field label { display: block; font-size: .77rem; color: var(--muted); margin-bottom: .2rem; }
.search-field input, #command {
  width: 100%; border: 1px solid var(--rule); background: var(--sheet); padding: .4rem .55rem;
}
input::placeholder { color: var(--muted); }
#count { color: var(--muted); font: .8rem/1.35 var(--mono); white-space: nowrap; padding-bottom: .7rem; }
.filters { grid-column: 1/-1; display: flex; gap: .3rem; flex-wrap: wrap; }
.filters button { padding-inline: .69rem; border-color: transparent; font-size: .82rem; }
.filters button:hover:not(:disabled) { border-color: var(--rule); }
.filters button[aria-pressed="true"] { border-color: var(--accent); }
#empty { color: var(--muted); padding-block: 2rem; }
#empty button { margin-top: .7rem; }
.grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: clamp(1.2rem,2.6vw,2.3rem) var(--gutter); padding-top: var(--gutter); }

.style { display: flex; flex-direction: column; min-width: 0; border-bottom: 1px solid var(--line); }
.style .image-button { order: -1; }
.style:has(.pick[aria-pressed="true"]) .image-button { outline: 2px solid var(--accent); outline-offset: -2px; }
.style h3 { display: grid; grid-template-columns: auto minmax(0,1fr); gap: .42rem; align-items: baseline; padding: .54rem 0 .36rem; font-size: .95rem; overflow-wrap: anywhere; }
.pending-preview { aspect-ratio: 3/4; display: grid; place-items: center; background: var(--mat); color: var(--muted); order: -1; }
.actions { display: flex; flex-wrap: wrap; gap: .34rem; }
.style .actions { margin-top: auto; justify-content: space-between; padding-bottom: .28rem; }
.style .actions button { padding-inline: .32rem; font-size: .79rem; border-color: transparent; white-space: nowrap; }
.style .actions button:focus-visible { outline-offset: 0; }
.style .actions .nearby-compare { border-color: var(--accent); }
.nearby-compare { margin-inline-start: auto; font-size: .82rem; white-space: nowrap; }

.comparison-bar {
  position: fixed; z-index: 2; left: 50%; bottom: calc(.7rem + env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(35rem,calc(100% - 1.4rem)); display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; align-items: center;
  gap: .36rem; padding: .44rem; border: 1px solid var(--rule); border-top: 3px solid var(--accent);
  background: var(--sheet); box-shadow: 0 .45rem 1.65rem rgb(16 22 17 / .17); font-size: .83rem;
}
.comparison-picks { display: flex; gap: .25rem; list-style: none; padding: 0; margin: 0; }
.comparison-picks img { display: block; width: 1.6rem; height: 2.2rem; object-fit: contain; background: var(--mat); }
#message,#dialog-message { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

dialog {
  --dialog-gutter: clamp(.8rem,2.1vw,1.6rem);
  width: min(70rem,calc(100% - 1.5rem)); max-height: calc(100dvh - 1.5rem);
  border: 1px solid var(--rule); padding: 0; background: var(--sheet); color: var(--ink); overflow: auto;
  overscroll-behavior: contain;
}
dialog[data-view="detail"] { width: min(52rem,calc(100% - 1.5rem)); }
dialog[data-view="specimen"] { width: min(53rem,calc(100% - 1.5rem)); }
dialog[data-view="copy"] { width: min(35rem,calc(100% - 1.5rem)); }
dialog::backdrop { background: rgb(15 21 17 / .63); }
.dialog-header {
  position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: .65rem;
  padding: .48rem var(--dialog-gutter); border-bottom: 1px solid var(--line); background: var(--sheet);
}
.dialog-header h2 { font-size: clamp(1rem,2.35vw,1.55rem); overflow-wrap: anywhere; }
.dialog-header form { flex-shrink: 0; }
.dialog-body { padding: var(--dialog-gutter); }
.detail { display: grid; grid-template-columns: minmax(0,1fr) minmax(12rem,16rem); gap: var(--dialog-gutter); align-items: start; }
.detail-art { display: grid; height: min(70dvh,43rem); place-items: center; background: var(--mat); }
.detail-art img { min-height: 0; }
.detail-side { min-width: 0; }
.detail-side h3 { font-size: 1.16rem; overflow-wrap: anywhere; }
.detail-meta { margin: .28rem 0 .85rem; color: var(--muted); font-size: .83rem; }
.detail-samples {
  display: grid; grid-template-columns: repeat(auto-fill,minmax(4.1rem,1fr)); gap: .42rem;
  max-height: 35dvh; overflow: auto; padding: .9rem .2rem .2rem; margin-top: 1rem; border-top: 1px solid var(--line);
}
.detail-samples button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
.detail-samples img { pointer-events: none; }
.detail-actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); margin-top: .75rem; }
.detail-actions > .primary { grid-column: 1/-1; }
.detail-actions .nearby-compare { margin: 0; }
.compare { display: grid; grid-template-columns: repeat(var(--columns), minmax(0,1fr)); gap: var(--gutter); }
.compare article { display: flex; flex-direction: column; gap: .45rem; min-width: 0; }
.compare h3 { font-size: .95rem; overflow-wrap: anywhere; }
.compare figure { min-width: 0; }
.compare img { height: auto; aspect-ratio: 3/4; max-height: 51dvh; background: var(--mat); }
.compare figcaption, .compare-caption { color: var(--muted); font-size: .82rem; }
.compare-caption { margin-bottom: .7rem; }
.compare figcaption { min-height: 2.65em; margin-top: .25rem; line-height: 1.35; overflow-wrap: anywhere; }
.compare-sample-nav { display: flex; flex-wrap: wrap; gap: .24rem; }
.compare button { font-size: .8rem; padding-inline: .4rem; }
.compare article > button { align-self: flex-start; margin-top: auto; }
.compare-pager { display: none; }
#copy-fallback { margin-top: .9rem; }
#copy-fallback label { display: block; margin-bottom: .28rem; }
.specimen-viewport { --reveal: 48%; position: relative; overflow: hidden; aspect-ratio: 3/2; background: var(--mat); }
.specimen-viewport:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
.specimen-image, .specimen-range { position: absolute; inset: 0; }
.specimen-image { overflow: hidden; }
.specimen-image img { position: absolute; display: block; width: 100%; height: 200%; object-fit: fill; }
.specimen-image:first-child img { bottom: 0; }
.specimen-image[data-side="original"] { clip-path: inset(0 calc(100% - var(--reveal)) 0 0); }
.specimen-image[data-side="original"] img { top: 0; }
.specimen-divider { position: absolute; top: 0; bottom: 0; left: var(--reveal); width: 2px; transform: translateX(-50%); background: #fffefa; pointer-events: none; }
.specimen-divider::after {
  content: "↔"; position: absolute; display: grid; place-items: center; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 2.25rem; height: 2.25rem; background: var(--cover); color: var(--cover-ink); border: 1px solid var(--cover-ink);
}
.specimen-range { width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; appearance: none; touch-action: pan-y; }
.specimen-range::-webkit-slider-runnable-track { height: 100%; }
.specimen-range::-webkit-slider-thumb { appearance: none; width: 1px; height: 100%; }
.specimen-range::-moz-range-thumb { width: 1px; height: 100%; }
.specimen-caption { display: flex; justify-content: space-between; gap: .65rem; margin: .35rem 0 .8rem; color: var(--muted); font-size: .85rem; }

/* Action feedback uses the same rust accent as the style index. */
.cover-link { gap: .64rem; padding: .24rem .24rem .24rem .73rem; }
.cover-arrow {
  display: grid; place-items: center; width: 1.95rem; height: 1.95rem;
  color: var(--on-accent); background: var(--accent); font: 1.15rem/1 var(--sans);
}
.cover-link:hover .cover-arrow { color: var(--cover-ink); background: var(--cover); }

.feature > .image-button, .style > .image-button { position: relative; }
.preview-arrow {
  position: absolute; right: .45rem; bottom: .45rem;
  display: grid; place-items: center; width: 2.05rem; height: 2.05rem;
  background: var(--cover); color: var(--cover-ink);
  border: 1px solid var(--cover-ink); font-size: 1rem; line-height: 1;
  pointer-events: none;
}
.image-button:focus-visible .preview-arrow, .style:has(.pick[aria-pressed="true"]) .preview-arrow {
  background: var(--accent); color: var(--on-accent);
}

.filters button { position: relative; }
.filters button::after {
  content: ""; position: absolute; inset: auto .42rem .24rem; height: 2px;
  background: var(--accent); transform: scaleX(0); transform-origin: left;
}
.filters button[aria-pressed="true"]::after, .filters button:focus-visible::after { transform: scaleX(1); }

.style .actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
.style .actions button { padding-inline: .25rem; }
.style .actions .nearby-compare { grid-column: 1/-1; width: 100%; margin: 0; }

button[data-action="copy"], .pick, #compare, .nearby-compare,
.compare-pager button, button[data-action="specimen"] {
  display: inline-flex; align-items: center; justify-content: center; gap: .32rem;
}

button[data-action="copy"] {
  --icon-fill: var(--paper);
}
button[data-action="copy"].primary { --icon-fill: var(--accent); }
dialog button[data-action="copy"]:not(.primary) { --icon-fill: var(--sheet); }

button[data-action="copy"]::before {
  content: ""; flex: 0 0 auto; display: block; width: .56rem; height: .61rem;
  margin-inline-start: .12rem; margin-inline-end: .06rem; margin-top: -.17rem;
  border: 1px solid currentColor;
  box-shadow: -.12rem .12rem 0 var(--icon-fill), -.18rem .18rem 0 currentColor;
}
button[data-action="copy"][data-copied="true"] {
  --icon-fill: var(--tint);
  background: var(--tint); border-color: var(--accent); color: var(--accent);
}
button[data-action="copy"][data-copied="true"]::before {
  width: .39rem; height: .68rem; margin: -.14rem .18rem 0; box-shadow: none;
  border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(42deg);
}
.pick::before {
  content: "+" / ""; width: .72rem; flex: 0 0 auto; font: .95rem/1 var(--mono);
}
.pick[aria-pressed="true"]::before { content: "−" / ""; }
#compare::after, .nearby-compare::after { content: "↗" / ""; font-size: .94em; }
button[data-action="specimen"]::before { content: "↔" / ""; font-family: var(--mono); }
.compare-pager button:first-child::before { content: "‹" / ""; font-size: 1.15em; }
.compare-pager button:last-child::after { content: "›" / ""; font-size: 1.15em; }

.dock-status { min-width: 0; padding-inline-start: .25rem; display: flex; align-items: center; gap: .45rem; }
#comparison-status { padding-inline-start: 0; }
.selection-marks { display: none; }
.selection-marks i {
  width: .32rem; height: .72rem; background: var(--mat); border: 1px solid var(--rule);
}
.comparison-bar[data-count="1"] .selection-marks i:first-child,
.comparison-bar[data-count="2"] .selection-marks i:nth-child(-n+2),
.comparison-bar[data-count="3"] .selection-marks i {
  background: var(--accent); border-color: var(--accent);
}
.specimen-viewport:focus-within .specimen-divider::after,
.specimen-viewport:has(.specimen-range:active) .specimen-divider::after {
  background: var(--accent); color: var(--on-accent);
}

@media (min-width: 64.001rem) {
  .feature { display: grid; grid-template-columns: minmax(0,1fr) auto; column-gap: .4rem; align-items: center; }
  .feature .image-button { grid-column: 1/-1; }
  .feature h3 { margin-top: .25rem; }
  .feature-action { margin-top: .25rem; white-space: nowrap; }
}
@media (max-width: 64rem) {
  .grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .hero { grid-template-columns: minmax(12.5rem,.9fr) minmax(0,2.1fr); }
}
@media (max-width: 47rem) {
  :root { --space: 1rem; scroll-padding-top: 1rem; }
  .hero { grid-template-columns: minmax(0,1fr); row-gap: .9rem; }
  .cover-story { padding: 1.05rem 1rem; gap: .55rem; }
  .cover-story h1 { font-size: clamp(2.6rem,10vw,4.6rem); }
  .cover-story h1 span { display: inline; }
  .cover-story h1 span + span { color: inherit; }
  .cover-story p { font-size: .81rem; }
  .cover-link { min-height: 2.75rem; }
  .catalog-tools { position: static; grid-template-columns: minmax(0,1fr) auto; }
  .catalog-tools h2 { grid-row: 1; }
  .search-field { grid-row: 2; grid-column: 1/-1; }
  #count { grid-row: 1; grid-column: 2; padding-bottom: .38rem; }
  .grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .style h3 { font-size: .83rem; }
  .style .actions { gap: .12rem; }
  .style .actions button { font-size: .75rem; }
  .style .actions .nearby-compare { margin-left: 0; }
  .detail { grid-template-columns: minmax(0,1fr); }
  .detail-art { height: min(58dvh,31rem); }
  .detail-samples { grid-template-columns: repeat(auto-fill,minmax(3.2rem,1fr)); max-height: none; }
}
@media (max-width: 38rem) {
  .comparison-bar { grid-template-columns: minmax(0,1fr) auto auto; }
  .comparison-picks { display: none; }
  .feature-grid { gap: .48rem; }
  .feature h3 { display: block; font-size: .73rem; line-height: 1.42; }
  .feature h3 .number { display: block; font-size: .73rem; }
  .feature-action { font-size: .73rem; }
  .compare { grid-template-columns: repeat(var(--columns),calc((100% - var(--gutter))/2)); overflow-x: auto; scroll-snap-type: x mandatory; padding: .15rem .2rem .55rem; }
  .compare article { scroll-snap-align: start; }
  .compare h3 { min-height: 2lh; }
  .compare-pager { display: flex; justify-content: space-between; align-items: center; gap: .35rem; margin-bottom: .55rem; font-size: .8rem; }
}
@media (max-width: 23rem) {
  .issue-line,.issue-line a { font-size: .75rem; }
  .filters button { padding-inline: .42rem; font-size: .79rem; }
}
@media (max-width: 38rem) {
  .selection-marks { display: inline-flex; gap: .13rem; }
  .style .actions button { padding-inline: .05rem; gap: .19rem; }
  .style .actions button[data-action="copy"] { white-space: normal; line-height: 1.2; }
  .preview-arrow { right: .32rem; bottom: .32rem; width: 1.8rem; height: 1.8rem; }
}
@media (hover: hover) and (pointer: fine) {
  .filters button:hover::after { transform: scaleX(1); }
  .image-button:hover .preview-arrow { background: var(--accent); color: var(--on-accent); }
  .style .actions button:not(.primary):hover:not(:disabled) { background: var(--tint); --icon-fill: var(--tint); }
}
@media (prefers-reduced-motion: no-preference) {
  .image-button img, .cover-arrow, .filters button::after, #compare::after, .nearby-compare::after,
  .specimen-divider::after { transition: transform 260ms var(--ease); }
  .preview-arrow { transition: color 160ms var(--ease), background-color 160ms var(--ease); }
  button:not(.image-button), .cover-link { transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease); }
  button:not(.image-button):not(:disabled):not([aria-disabled="true"]):active, .cover-link:active { transform: translateY(1px); }
  button[data-action="copy"][data-copied="true"]::before { animation: mark-copy 230ms var(--ease) both; }
  .specimen-viewport:has(.specimen-range:active) .specimen-divider::after { transform: translate(-50%,-50%) scale(1.1); }
  .comparison-bar:not([hidden]) { animation: dock-arrive 220ms var(--ease) both; }
  dialog[open] { animation: open-viewer 180ms var(--ease) both; }
}
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  .image-button:hover img { transform: scale(1.022); }

<script>
const styles = JSON.parse(document.getElementById('catalog').textContent);
const byId = new Map(styles.map(style => [style.number, style]));
const bySlug = new Map(styles.map(style => [style.slug, style]));
const get = id => document.getElementById(id);
const grid = get('grid');
const catalog = get('catalog-browser');
const catalogTools = get('catalog-tools');
const search = get('search');
const filterGroup = get('filters');
const empty = get('empty');
const comparisonBar = get('comparison-bar');
const compareButton = get('compare');
const viewer = get('viewer');
const viewerTitle = get('viewer-title');
const viewerContent = get('viewer-content');
const fallback = get('copy-fallback');
const command = get('command');
const close = viewer.querySelector('form button');
const selected = new Set();
const sampleIndexes = new Map();
const copyTimers = new WeakMap();
const copyLabel = '复制选用指令';
const cards = [];
const specimenIndexes = new Map();
let activeCategory = 'all';
let lastCatalogPick;
let backdropPressed = false;
const categories = [
  {id: 'all', label: '全部'},
  {id: 'drawing', label: '线绘与插画', numbers: [3,5,7,13,15,16,18,19,21,22,23,30,36,41,42,47]},
  {id: 'material', label: '纸艺与实体', numbers: [1,2,9,14,17,24,26,27,28,29,37,40,46]},
  {id: 'photo', label: '摄影与光影', numbers: [8,31,32,33,34,35,38,39,43,49]},
  {id: 'graphic', label: '图形与排版', numbers: [4,6,10,11,12,20,25,44,45,48]},
];
const categoryFor = new Map(categories.flatMap(category => (category.numbers ?? []).map(number => [number, category.id])));

function element(tag, classes, text) {
  const node = document.createElement(tag);
  if (classes) node.className = classes;
  if (text) node.textContent = text;
  return node;
}

function button(text, action, number, classes) {
  const node = element('button', classes, text);
  node.type = 'button';
  if (action) node.dataset.action = action;
  if (number !== undefined) node.dataset.number = number;
  return node;
}

function image(sample, lazy = false) {
  const node = element('img');
  node.src = sample.path;
  node.alt = sample.title;
  node.decoding = lazy ? 'async' : 'auto';
  if (lazy) node.loading = 'lazy';
  return node;
}

function pictureButton(style, index, lazy) {
  const cover = button('', 'detail', style.number, 'image-button');
  if (index !== undefined) cover.dataset.index = index;
  cover.setAttribute('aria-label', '看大图：' + style.name);
  cover.setAttribute('aria-haspopup', 'dialog');
  const arrow = element('span', 'preview-arrow', '↗');
  arrow.setAttribute('aria-hidden', 'true');
  cover.append(image(style.examples[index ?? 0], lazy), arrow);
  return cover;
}

const nearbyCompare = button('查看对比', 'compare', undefined, 'primary nearby-compare');
nearbyCompare.setAttribute('aria-haspopup', 'dialog');

function buildCard(style) {
  const card = element('article', 'style');
  card.dataset.style = style.number;
  const heading = element('h3');
  heading.append(element('span', 'number', String(style.number).padStart(2, '0')), document.createTextNode(style.name));
  const cover = style.examples.length ? pictureButton(style, undefined, true) : element('p', 'pending-preview', '暂无实图示例');
  const actions = element('div', 'actions');
  const pick = button('加入对比', 'toggle', style.number, 'pick');
  pick.hidden = !style.examples.length;
  actions.append(button(copyLabel, 'copy', style.number), pick);
  card.append(heading, cover, actions);
  const matchText = (style.name + ' ' + style.slug + ' ' + style.aliases).toLowerCase();
  return {card, pick, style, matchText};
}

function renderShowcase() {
  const favorites = [
    {slug: 'arc-grid-photo-inlay', title: 'Ice Strata', split: true},
    {slug: 'ascii-halftone-travel-collage', title: 'FOREST LIGHT', split: true},
    {slug: 'chinese-shadow-puppet', title: '晴空一枝'},
  ];
  const featured = get('featured');
  for (const {slug,title,split} of favorites) {
    const style = bySlug.get(slug);
    if (!style?.examples.length) continue;
    const exact = style.examples.findIndex(sample => sample.title === title);
    const index = Math.max(0, exact);
    const card = element('article', 'feature');
    const heading = element('h3');
    heading.append(element('span', 'number', String(style.number).padStart(2, '0')), document.createTextNode(style.name));
    card.append(pictureButton(style, index, false), heading);
    if (split && exact >= 0) {
      specimenIndexes.set(style.number, index);
      card.append(button('拖动对照', 'specimen', style.number, 'feature-action'));
    } else {
      const open = button('查看海报', 'detail', style.number, 'feature-action');
      open.dataset.index = index;
      card.append(open);
    }
    featured.append(card);
  }
  get('showcase').hidden = !featured.childElementCount;
}

function filterCards(jump = false) {
  const query = search.value.trim().toLowerCase().replace(/^第\s*0*(\d+)\s*项?$/, '$1');
  const numeric = /^\d+$/.test(query);
  const terms = query ? query.split(/\s+/) : [];
  const wasPinned = jump && catalogTools.getBoundingClientRect().top <= 1;
  let visible = 0;
  for (const {card, style, matchText} of cards) {
    const inCategory = activeCategory === 'all' || categoryFor.get(style.number) === activeCategory;
    const match = inCategory && (numeric ? style.number === Number(query) : terms.every(word => matchText.includes(word)));
    card.hidden = !match;
    if (match) visible++;
  }
  for (const control of filterGroup.children) control.setAttribute('aria-pressed', String(control.dataset.category === activeCategory));
  get('count').textContent = visible + ' / ' + styles.length + ' 种';
  empty.hidden = visible !== 0;
  placeNearbyCompare();
  if (wasPinned) catalog.scrollIntoView({block: 'start'});
}

function syncPick(pick, style) {
  const added = selected.has(style.number);
  pick.textContent = added ? '移出对比' : '加入对比';
  pick.setAttribute('aria-pressed', String(added));
  pick.setAttribute('aria-label', pick.textContent + '：' + style.name);
  pick.disabled = !style.examples.length || (!added && selected.size === 3);
}

function refreshComparisonPicks() {
  get('comparison-picks').replaceChildren(...[...selected].map(number => {
    const style = byId.get(number);
    const item = element('li');
    const thumb = image(style.examples[sampleIndexes.get(number) ?? 0]);
    thumb.alt = style.name;
    item.append(thumb);
    return item;
  }));
}

function placeNearbyCompare() {
  nearbyCompare.hidden = selected.size < 2;
  if (nearbyCompare.hidden) return;
  if (lastCatalogPick?.closest('.style:not([hidden])')) {
    if (lastCatalogPick.nextElementSibling !== nearbyCompare) lastCatalogPick.after(nearbyCompare);
  } else if (nearbyCompare.parentElement !== catalogTools) {
    catalogTools.append(nearbyCompare);
  }
}

function refreshSelection() {
  for (const {pick,style} of cards) syncPick(pick,style);
  const detailPick = viewerContent.querySelector('.detail-actions .pick');
  if (detailPick) {
    syncPick(detailPick, byId.get(Number(detailPick.dataset.number)));
    viewerContent.querySelector('.detail-actions [data-action="compare"]').hidden = selected.size < 2;
  }
  comparisonBar.dataset.count = selected.size;
  comparisonBar.hidden = selected.size === 0;
  get('comparison-status').textContent = selected.size === 1 ? '已选 1 种，再选 1 种即可对比' : '已选 ' + selected.size + ' / 3 种';
  compareButton.disabled = selected.size < 2;
  refreshComparisonPicks();
  placeNearbyCompare();
}

function rememberSample(style, index) {
  sampleIndexes.set(style.number,index);
  if (selected.has(style.number)) refreshComparisonPicks();
}

function resetViewer(view, title) {
  viewer.dataset.view = view;
  viewerTitle.textContent = title;
  viewerContent.replaceChildren();
  get('dialog-message').textContent = '';
  fallback.hidden = true;
}

function revealViewer() {
  if (!viewer.open) viewer.showModal();
  close.focus({preventScroll:true});
  viewer.scrollTop = 0;
}

function showDetail(style, initial = sampleIndexes.get(style.number) ?? 0) {
  if (!style?.examples.length) return;
  resetViewer('detail', style.number + ' · ' + style.name);
  const detail = element('div','detail');
  const art = element('div','detail-art');
  const photo = element('img');
  photo.decoding = 'async';
  art.append(photo);
  const side = element('div','detail-side');
  const title = element('h3');
  const meta = element('p','detail-meta');
  meta.setAttribute('aria-live','polite');
  const thumbnails = element('div','detail-samples');
  thumbnails.setAttribute('role','group');
  thumbnails.setAttribute('aria-label','选择样片');
  const thumbButtons = style.examples.map((sample,index) => {
    const thumb = button('',undefined,undefined,'image-button');
    thumb.setAttribute('aria-label','查看样片 ' + (index + 1) + '：' + sample.title);
    const artwork = image(sample);
    artwork.alt = '';
    thumb.append(artwork);
    thumb.addEventListener('click',() => selectSample(index));
    return thumb;
  });
  thumbnails.append(...thumbButtons);
  thumbnails.hidden = style.examples.length < 2;
  const actions = element('div','actions detail-actions');
  const specimen = button('拖动对照','specimen',style.number);
  const pick = button('加入对比','toggle',style.number,'pick');
  const compare = button('查看对比','compare',undefined,'nearby-compare');
  syncPick(pick,style);
  compare.hidden = selected.size < 2;
  actions.append(button(copyLabel,'copy',style.number,'primary'), pick, compare, specimen);
  function selectSample(index) {
    const sample = style.examples[index];
    rememberSample(style,index);
    photo.src = sample.path;
    photo.alt = sample.title;
    title.textContent = sample.title;
    meta.textContent = '第 ' + (index + 1) + ' 张，共 ' + style.examples.length + ' 张';
    thumbButtons.forEach((thumb,position) => thumb.setAttribute('aria-pressed',String(position === index)));
    specimen.hidden = specimenIndexes.get(style.number) !== index;
  }
  side.append(title,meta,actions,thumbnails);
  detail.append(art,side);
  viewerContent.append(detail);
  selectSample(initial);
  revealViewer();
}

function showSpecimen(style) {
  const index = specimenIndexes.get(style.number);
  if (index === undefined) return;
  const sample = style.examples[index];
  resetViewer('specimen', sample.title);
  const viewport = element('div','specimen-viewport');
  for (const [label,key] of [['风格转译','styled'], ['原照','original']]) {
    const layer = element('div','specimen-image');
    layer.dataset.side = key;
    const art = image(sample);
    art.alt = sample.title + ' · ' + label;
    layer.append(art);
    viewport.append(layer);
  }
  const divider = element('div','specimen-divider');
  divider.setAttribute('aria-hidden','true');
  const range = element('input','specimen-range');
  range.type = 'range';
  range.min = '0';
  range.max = '100';
  range.value = '48';
  range.setAttribute('aria-label','原照与风格转译的分界');
  function updateDivider() {
    viewport.style.setProperty('--reveal',range.value + '%');
    range.setAttribute('aria-valuetext','原照 ' + range.value + '%，转译 ' + (100 - range.value) + '%');
  }
  viewport.append(divider,range);
  range.addEventListener('input',updateDivider);
  updateDivider();
  const caption = element('p','specimen-caption');
  for (const part of ['原照', style.name, '风格转译']) caption.append(element('span','',part));
  const complete = button('查看完整海报','detail',style.number,'primary');
  complete.dataset.index = index;
  viewerContent.append(viewport,caption,complete);
  revealViewer();
}

function comparisonCard(style) {
  const card = element('article');
  card.append(element('h3','',style.number + ' · ' + style.name));
  const figure = element('figure');
  const preview = element('img');
  preview.decoding = 'async';
  const caption = element('figcaption');
  caption.setAttribute('aria-live','polite');
  figure.append(preview,caption);
  function display(index) {
    const sample = style.examples[index];
    preview.src = sample.path;
    preview.alt = sample.title;
    caption.textContent = sample.title + ' · ' + (index + 1) + ' / ' + style.examples.length;
  }
  display(sampleIndexes.get(style.number) ?? 0);
  card.append(figure);
  if (style.examples.length > 1) {
    const controls = element('div','compare-sample-nav');
    for (const [text,delta] of [['上一张',-1],['下一张',1]]) {
      const move = button(text);
      move.setAttribute('aria-label',style.name + '：' + text + '样片');
      move.addEventListener('click',() => {
        const total = style.examples.length;
        const index = ((sampleIndexes.get(style.number) ?? 0) + delta + total) % total;
        rememberSample(style,index);
        display(index);
      });
      controls.append(move);
    }
    card.append(controls);
  }
  card.append(button(copyLabel,'copy',style.number));
  return card;
}

function comparisonPager(row) {
  const navigation = element('div','compare-pager');
  const previous = button('上一组');
  const next = button('下一组');
  const status = element('output');
  status.setAttribute('aria-live','polite');
  function refresh() {
    const end = row.scrollWidth - row.clientWidth;
    const last = end > 0 && row.scrollLeft >= end / 2;
    const text = last ? '第 2、3 种' : '第 1、2 种';
    if (status.textContent !== text) status.textContent = text;
    previous.setAttribute('aria-disabled',String(!last));
    next.setAttribute('aria-disabled',String(last));
  }
  previous.addEventListener('click',() => {
    if (previous.getAttribute('aria-disabled') === 'false') row.scrollTo({left:0});
  });
  next.addEventListener('click',() => {
    if (next.getAttribute('aria-disabled') === 'false') row.scrollTo({left:row.scrollWidth - row.clientWidth});
  });
  row.addEventListener('scroll',refresh,{passive:true});
  refresh();
  navigation.append(previous,status,next);
  return navigation;
}

function showComparison() {
  if (selected.size < 2) return;
  resetViewer('comparison','并排对比');
  const row = element('div','compare');
  row.style.setProperty('--columns', selected.size);
  for (const number of selected) row.append(comparisonCard(byId.get(number)));
  viewerContent.append(element('p','compare-caption','样片可能来自不同照片。可为每种画风独立换图。'));
  if (selected.size === 3) viewerContent.append(comparisonPager(row));
  viewerContent.append(row);
  revealViewer();
}

async function copyChoice(style, control) {
  const text = '用第 ' + style.number + ' 项「' + style.name + '」';
  const fromViewer = viewer.open;
  const feedback = get(fromViewer ? 'dialog-message' : 'message');
  try {
    await navigator.clipboard.writeText(text);
    feedback.textContent = '已复制：' + text;
    clearTimeout(copyTimers.get(control));
    control.textContent = '已复制';
    control.dataset.copied = 'true';
    copyTimers.set(control,setTimeout(() => {
      control.textContent = copyLabel;
      delete control.dataset.copied;
      copyTimers.delete(control);
    },2200));
  } catch {
    if (fromViewer && !viewer.open) return;
    if (!viewer.open) {
      resetViewer('copy','选用画风');
      revealViewer();
    }
    fallback.hidden = false;
    command.value = text;
    command.focus();
    command.select();
  }
}

function handleAction(event) {
  const control = event.target.closest('button[data-action]');
  if (!control) return;
  const number = Number(control.dataset.number);
  const style = byId.get(number);
  switch (control.dataset.action) {
    case 'detail':
      showDetail(style,control.dataset.index === undefined ? undefined : Number(control.dataset.index));
      break;
    case 'specimen':
      showSpecimen(style);
      break;
    case 'compare':
      showComparison();
      break;
    case 'copy':
      copyChoice(style,control);
      break;
    case 'toggle':
      if (grid.contains(control)) lastCatalogPick = control;
      if (selected.has(number)) selected.delete(number);
      else if (selected.size < 3) selected.add(number);
      refreshSelection();
      break;
  }
}

function isBackdrop(event) {
  if (event.target !== viewer) return false;
  const {left,top,right,bottom} = viewer.getBoundingClientRect();
  return event.clientX < left || event.clientX >= right || event.clientY < top || event.clientY >= bottom;
}
viewer.addEventListener('pointerdown',event => { backdropPressed = event.button === 0 && isBackdrop(event); });
viewer.addEventListener('pointercancel',() => { backdropPressed = false; });
viewer.addEventListener('click',event => {
  if (backdropPressed && isBackdrop(event)) viewer.close();
  backdropPressed = false;
});

const cardList = document.createDocumentFragment();
for (const style of styles) {
  const entry = buildCard(style);
  cards.push(entry);
  cardList.append(entry.card);
}
grid.append(cardList);
for (const category of categories) {
  const filter = button(category.label);
  filter.dataset.category = category.id;
  filterGroup.append(filter);
}
filterGroup.addEventListener('click',event => {
  const category = event.target.closest('button')?.dataset.category;
  if (!category || activeCategory === category) return;
  activeCategory = category;
  filterCards(true);
});
search.addEventListener('input',() => filterCards(true));
get('reset-filters').addEventListener('click',() => {
  activeCategory = 'all';
  search.value = '';
  filterCards();
  search.focus();
});
grid.addEventListener('click',handleAction);
catalogTools.addEventListener('click',handleAction);
viewerContent.addEventListener('click',handleAction);
get('featured').addEventListener('click',handleAction);
compareButton.addEventListener('click',showComparison);
get('clear').addEventListener('click',() => {
  const target = lastCatalogPick?.closest('.style:not([hidden])') ? lastCatalogPick : search;
  selected.clear();
  refreshSelection();
  target.focus({preventScroll:true});
});
get('browse').href = '#catalog-browser';
get('cover-count').textContent = styles.length + ' 种画风  /  ' + styles.reduce((sum,style) => sum + style.examples.length,0) + ' 张样片';
renderShowcase();
catalogTools.hidden = false;
refreshSelection();
filterCards();
</script>
</body>
</html>
